# Dependabot (Sentinel dependency layer, ADR-018, #34).
# PRs from Dependabot go through Sentinel and the owner's `safemerge` like any other PR.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Supply-chain buffer: don't propose a release until it is a week old.
    # Security updates are not delayed by this.
    cooldown:
      default-days: 7
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    groups:
      actions-minor-and-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "ci"

  # Pre-commit hook revisions in .pre-commit-config.yaml (#42).
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "hooks"

  # Postgres image in docker-compose.yml (#52, ADR-020). Digest and 18.x updates
  # only: a major upgrade (Postgres 19) needs a dump/restore or pg_upgrade plan.
  # Sentinel starts Postgres from docker-compose.yml, so these PRs are tested
  # against the new image automatically.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
      - dependency-name: "library/postgres"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "docker"

  # The dispatcher's test image (ADR-030 step 4b, #204). The base is pinned by
  # digest. Digest and patch bumps only: the Python minor must match
  # .python-version. Sentinel does not build this image, so the owner checks
  # these PRs by hand; the dispatcher rebuilds it on the next local try.
  - package-ecosystem: "docker"
    directory: "/dispatch/test-image"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    commit-message:
      prefix: "docker"
