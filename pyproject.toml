[project]
name = "aether"
version = "0.1.0"
description = "AETHER: personal multi-model AI platform (Core, Nexus, Memory)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.8.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.163.1",
    "httpx>=0.28.1",
    "nvidia-ml-py>=13.615.71",
    "ollama>=0.6.3",
    "pydantic-settings>=2.16.3",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.1",
    "mypy>=1.13",
    "pip-audit>=2.10.1",
    "pre-commit>=4.7.0",
    "pytest>=8.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.8",
    "types-pyyaml>=6.0.12.20261113",
]

[tool.uv]
# Application, not a library: no build step; tests import from the repo root.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "db: needs the local Postgres from docker-compose.yml; run with AETHER_DB_TESTS=1",
]

[tool.coverage.run]
# Report only for now (#43): no fail_under until the baseline settles.
source = ["core", "router", "memory"]
branch = true
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "UP", "B", "SIM", "S", "RUF",
    # Structure (#26): complexity, function size and dead code.
    "C90",      # mccabe complexity
    "ERA",      # commented-out code
    "ARG",      # unused arguments
    "PLR0911",  # too many return statements
    "PLR0912",  # too many branches
    "PLR0913",  # too many arguments
    "PLR0915",  # too many statements
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",     # assert is how pytest works
    "ARG",      # pytest fixtures are often requested only for their side effects
    "PLR0913",  # test functions take many fixtures
]

[tool.mypy]
python_version = "3.12"
strict = true
# Check the whole repo so new folders are never silently skipped.
files = ["."]
exclude = [
    '^\.venv/',
    '^\.(mypy|pytest|ruff)_cache/',
    '^(build|dist)/',
]
plugins = ["pydantic.mypy"]  # ADR-019

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
