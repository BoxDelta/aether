# Alembic config (ADR-020). The database URL is NOT here: migrations/env.py reads
# DATABASE_URL from the environment / .env via core.config, so no password is
# ever written to this file. Logging goes through core.log (with redaction).
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
path_separator = os
