# Triage eval set (ADR-030 step 4a). Closed issues from this repository.
# expected: "claude" if the owner labelled the issue model:opus, or the merged PR
# that closed it touched an always-Claude path (dispatch/rules.py); else "local".
# deciding_files: for claude, the listed paths that PR touched (or every file, when
# deciding_label decides); for local, every file it touched.
issues:
