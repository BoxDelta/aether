      - tests/conftest.py
      - tests/fakes.py
      - tests/test_auth.py
      - tests/test_chat.py
      - tests/test_chat_output_cap.py
      - tests/test_db_live.py
      - tests/test_error_bodies.py
      - tests/test_events_live.py
      - tests/test_failover.py
      - tests/test_hardware.py
      - tests/test_ollama_host_trust.py
      - tests/test_routing.py
