# Opt-in drop-in (ADR-026, #57): backups go to the encrypted volume, and the
# backup refuses to run while the volume is not mounted.
# Install it only at stage 4b of docs/runbooks/encrypted-volume.md, as
# ~/.config/systemd/user/aether-backup.service.d/vault.conf
#
# If the volume is locked or not mounted, this step exits 1 with one line at
# priority err ("<3>"), so the unit shows as failed and
# `journalctl --user -u aether-backup.service -p err` shows why, as today. No
# backup is written: the bare mount point is empty and immutable (chattr +i).
# No password, key or passphrase is in this file.
[Service]
Environment=AETHER_BACKUP_DIR=%h/.local/share/aether/vault/backups
ExecStartPre=/bin/sh -c 'v="$$1"; if mountpoint -q "$$v" && [ -f "$$v/.aether-vault" ] && [ -d "$$v/backups" ]; then exit 0; fi; echo "<3>aether-backup: encrypted volume not mounted (or no AETHER marker); no backup written" >&2; exit 1' aether-vault-guard %h/.local/share/aether/vault
